name: Lean

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build BSDBridgeC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for forbidden proof placeholders
        run: |
          if grep -rnE '\bsorry\b|\badmit\b' BSDBridgeC --include='*.lean'; then
            echo "Found forbidden sorry/admit in Lean code."
            exit 1
          fi
          if grep -rn '^axiom' BSDBridgeC --include='*.lean'; then
            echo "Found forbidden axiom in Lean code."
            exit 1
          fi

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: BSDBridgeC
